<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070912">
<title>Lightwave</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="board"></canvas>

<header class="hud hud-top">
  <div class="wordmark">
    <h1>L I G H T W A V E</h1>
    <div class="rule"></div>
  </div>
  <button id="level-badge" class="level-badge" title="Choose a level" aria-haspopup="dialog">
    <span class="eyebrow">Level</span>
    <span id="level-no" class="numeral">I</span>
  </button>
</header>

<div id="level-overlay" class="level-overlay" role="dialog" aria-modal="true" aria-label="Choose a level" hidden>
  <div class="level-panel">
    <h2>Choose a Level</h2>
    <div class="rule"></div>
    <div id="level-grid" class="level-grid"></div>
  </div>
</div>

<footer class="hud hud-bottom">
  <div id="legend" class="legend">R+G=Y&ensp;·&ensp;R+B=M&ensp;·&ensp;G+B=C&ensp;·&ensp;R+G+B=W</div>
  <div class="center-stack">
    <div id="goal-chips" class="chips"></div>
    <div id="hint" class="hint"></div>
  </div>
  <button id="btn-reset" class="btn-reset" title="Re-scatter this level">&#8634;</button>
</footer>

<div id="win-banner" class="win-banner"><span>Resolved</span></div>

<script src="js/rng.js"></script>
<script src="js/color.js"></script>
<script src="js/engine.js"></script>
<script src="js/gen.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
