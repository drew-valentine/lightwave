name: Deploy to GitHub Pages

# Deploys run via the legacy branch builder (build_type: legacy, main@/).
# This workflow is kept as a manual fallback only — the two deploy paths
# must not both trigger on push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000  # Pages status propagation for this site runs slow; 10min default was timing out
